// ---- HELPERS ----
function brl(v,d){ d=d||0; if(v==null) return '—'; return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function pct(v,d){ d=d==null?1:d; if(v==null) return '—'; return (v*100).toFixed(d).replace('.',',')+'%'; }
function spct(v,d){ if(v==null) return '—'; return (v>=0?'+':'')+pct(v,d); }
function num(v){ if(v==null) return '—'; return Math.round(v).toLocaleString('pt-BR'); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// converte objeto de estilo em string CSS inline
function st(o){ return Object.keys(o).map(k=>{
  const prop = k.replace(/[A-Z]/g,m=>'-'+m.toLowerCase());
  let val = o[k];
  if (typeof val==='number' && !['zIndex','opacity','flex','fontWeight','order','flexGrow','flexShrink'].includes(k)) val = val+'px';
  return prop+':'+val;
}).join(';'); }

// ============================================================
//  CÁLCULO DOS VALORES (porte fiel de renderVals())

function computeVals(){

  const mi = monthIdx, pmi = mi-1;

  const mkChannel = (id,nome,cor,key) => {
    const fat = D[key].fat[mi], cresc = D[key].crescMes[mi];
    return { id, nome, cor, fatFmt:brl(fat), crescFmt:spct(cresc),
      crescPos:cresc!=null&&cresc>=0, crescNeg:cresc!=null&&cresc<0, crescNA:cresc==null,
      notasFmt:num(D[key].notas[mi]), ticketFmt:brl(D[key].ticket[mi],2),

    mkChannel('loja','Loja (Rede Física)','#37d899','loja'),
    mkChannel('site','Site','#3b82f6','site'),
    mkChannel('callcenter','Call Center','#8b5cf6','callcenter'),
    mkChannel('ifood','iFood','#f97316','ifood'),
  ];
  const channels = chFilter==='todos' ? channelsAll : channelsAll.filter(c=>c.id===chFilter);

  const chipDefs = [ {id:'todos',label:'Todos os Canais'},{id:'loja',label:'Loja'},{id:'site',label:'Site'},{id:'callcenter',label:'Call Center'},{id:'ifood',label:'iFood'} ];

  const monthOptions = MESES.map((m,i)=>({ idx:i, label: i===6 ? (m+' (até 22/07)') : m }));

  const totalFat = fatAt(mi);
  const totalFatPrev = mi>0 ? fatAt(pmi) : null;
  const totalGrowth = totalFatPrev ? (totalFat-totalFatPrev)/totalFatPrev : null;
  const totalNotas = notasAt(mi);
  const avgTicket = totalNotas ? totalFat/totalNotas : null;

  const maxFat = Math.max.apply(null, MESES.map((_,i)=>fatAt(i)));
  const trendBars = MESES.map((m,i)=>{ const h=Math.max(6,Math.round((fatAt(i)/maxFat)*120));

  const topPages = [

  const motionBars = win.map((i,k)=>{ const mom = k>0 ? (fatAt(i)-fatAt(win[k-1]))/fatAt(win[k-1]) : null;
    return { label:MESES[i]+parcial(i), valueFmt:brl(fatAt(i)), momFmt:mom==null?'':spct(mom), momPos:mom!=null&&mom>=0, momNeg:mom!=null&&mom<0,
      barStyle:st({width:'70%',maxWidth:120,borderRadius:'8px 8px 0 0',height:Math.round((fatAt(i)/maxWin)*160),transformOrigin:'bottom',
        background:i===cur?'linear-gradient(180deg,#5eead1,#37d899,#22c789)':'linear-gradient(180deg,#475569,#334155,#475569)',
        backgroundSize:'100% 300%',animation:'omGrow .7s ease-out, omFlow 3s linear infinite'}) }; });

  const notaCur = k => D[k].notas[cur]||0;
  const fluxoRaw = [
    {nome:'Loja',v:notaCur('loja'),cor:'#37d899'},{nome:'iFood',v:notaCur('ifood'),cor:'#f97316'},
    {nome:'Call Center',v:notaCur('callcenter'),cor:'#8b5cf6'},{nome:'Site',v:notaCur('site'),cor:'#3b82f6'},
  ];
  const fluxoTot = fluxoRaw.reduce((a,b)=>a+b.v,0);
  const fluxoMax = Math.max.apply(null, fluxoRaw.map(f=>f.v));
  const fluxo = fluxoRaw.map(f=>({ nome:f.nome, valueFmt:num(f.v), shareFmt:pct(fluxoTot?f.v/fluxoTot:0),
    barStyle:st({height:14,borderRadius:99,background:f.cor,width:Math.max(2,Math.round((f.v/fluxoMax)*100))+'%',transformOrigin:'left',animation:'omGrowX .8s ease-out'}) }));

  const digRaw = [
    {nome:'iFood',k:'ifood',cor:'#f97316'},{nome:'Call Center',k:'callcenter',cor:'#8b5cf6'},{nome:'Site',k:'site',cor:'#3b82f6'},
  ].map(d=>({ ...d, v:notaCur(d.k), prev:D[d.k].notas[cur-1]||0 }));
  const digMax = Math.max.apply(null, digRaw.map(d=>d.v));
  const fluxoDigital = digRaw.map(d=>{ const mom=d.prev?(d.v-d.prev)/d.prev:null;
    return { nome:d.nome, valueFmt:num(d.v), momFmt:mom==null?'—':spct(mom),
      barStyle:st({height:14,borderRadius:99,background:d.cor,width:Math.max(2,Math.round((d.v/digMax)*100))+'%',transformOrigin:'left',animation:'omGrowX .8s ease-out'}) }; });

  const organico = notaCur('loja');
  const digital = notaCur('site')+notaCur('callcenter')+notaCur('ifood');
  const dvoTot = organico+digital||1;
  const orgPrev = D.loja.notas[cur-1]||0;
  const digPrev = (D.site.notas[cur-1]||0)+(D.callcenter.notas[cur-1]||0)+(D.ifood.notas[cur-1]||0);
  const organicoShare = organico/dvoTot, digitalShare = digital/dvoTot;
  const clientesMes = fluxoTot;
  const clientesMoM = orgPrev+digPrev ? (dvoTot-(orgPrev+digPrev))/(orgPrev+digPrev) : null;

  const yoyMax = Math.max.apply(null, win.flatMap(i=>[D.loja.fat2025[i],D.loja.fat[i]]));
  const yoyBars = win.map(i=>{ const v25=D.loja.fat2025[i], v26=D.loja.fat[i], delta=v25?(v26-v25)/v25:null;
    return { label:MESES[i].slice(0,3)+parcial(i), v25Fmt:brl(v25), v26Fmt:brl(v26), deltaFmt:spct(delta), pos:delta>=0, neg:delta<0,
      bar25Style:st({width:22,borderRadius:'6px 6px 0 0',height:Math.round((v25/yoyMax)*130),background:'#cbd5e1'}),
      bar26Style:st({width:22,borderRadius:'6px 6px 0 0',height:Math.round((v26/yoyMax)*130),background:'#37d899',transformOrigin:'bottom',animation:'omGrow .7s ease-out'}) }; });
  const homeYoY = D.loja.fat2025[cur] ? (D.loja.fat[cur]-D.loja.fat2025[cur])/D.loja.fat2025[cur] : null;

  return {
    navItems, tabTitle, tabSub, atualizacao:ATUALIZACAO,
    isHome:tab==='home', isVisao:tab==='visao', isCampanhas:tab==='campanhas', isAnalytics:tab==='analytics',
    isIndicadores:tab==='indicadores', isComentarios:tab==='comentarios', isBrand:tab==='brand',
    janelaLabel: MESES[win[0]].slice(0,3)+' – '+MESES[win[2]].slice(0,3)+'/2026',
    motionBars, fluxo, fluxoDigital, yoyBars,
    clientesMesFmt:num(clientesMes), clientesMoMFmt:spct(clientesMoM),
    homeFatFmt:brl(fatAt(cur)), homeFatMoMFmt:spct((fatAt(cur)-fatAt(cur-1))/fatAt(cur-1)), homeYoYFmt:spct(homeYoY),
    organicoFmt:num(organico), organicoShareFmt:pct(organicoShare), organicoMoMFmt:spct(orgPrev?(organico-orgPrev)/orgPrev:null),
    digitalFmt:num(digital), digitalShareFmt:pct(digitalShare), digitalMoMFmt:spct(digPrev?(digital-digPrev)/digPrev:null),
    splitOrganicoStyle:st({width:(organicoShare*100)+'%',background:'#37d899',transformOrigin:'left',animation:'omGrowX .8s ease-out'}),
    splitDigitalStyle:st({width:(digitalShare*100)+'%',background:'#3b82f6',transformOrigin:'left',animation:'omGrowX .8s ease-out'}),
    monthIdx, monthOptions,
    totalFatFmt:brl(totalFat), totalGrowthFmt:spct(totalGrowth), totalNotasFmt:num(totalNotas),
    avgTicketFmt:brl(avgTicket,2), visitasSiteFmt:num(D.site.visitas[mi]), gaConversaoFmt:pct(D.site.conversao[mi]),
    insightText, chChips, channels, trendBars,
    budgetSorted, budgetTotalFmt:num(budgetTotal), budgetSortIcon,
    campPlat, campSort, camps, totalGastoFmt:brl(totalGasto), metaGastoFmt:brl(metaGasto), googleGastoFmt:brl(googleGasto),
    gaSessoesFmt, gaUsuariosFmt:num(gaUsuarios), gaBounceFmt:pct(0.46), gaTrend, trafficSources, devices, topPages,
    comparativos, alertas:ALERTAS, budgetSugestoes:BUDGET_SUG, mensagemSugestoes:MSG_SUG,
    newComment:state.newComment, newCommentTag:state.newCommentTag, commentsDisp, news:NEWS,
    chatDisp, chatInput:state.chatInput, chatLoading,
    awarenessFmt:'61%', awarenessTrend, npsFmt:'42', npsTrend, sentimento, competidores,
  };
}

function render(){

  document.getElementById('app').innerHTML = `

    </nav>

      <div style="background:#fff;border-bottom:1px solid #e8eaed;padding:0 26px;height:60px;display:flex;align-items:center;gap:16px;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.06)">
        <div>
          <div style="font-weight:800;font-size:17px;line-height:1.1;color:#0f172a;letter-spacing:-.3px">${esc(v.tabTitle)}</div>
          <div style="font-weight:500;font-size:11px;line-height:1;color:#94a3b8;margin-top:3px">${esc(v.tabSub)}</div>
        </div>
        <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
          <span style="display:inline-flex;align-items:center;gap:6px;background:#f0fdf4;border:1px solid #86efac;color:#065f46;padding:6px 11px;border-radius:99px;font-weight:600;font-size:11px">
            <i data-lucide="refresh-cw" style="width:12px;height:12px"></i> Atualizado em ${esc(v.atualizacao)}
          </span>
          ${monthSel}
        </div>
      </div>
      <div style="flex:1;overflow-y:auto;padding:24px 28px 44px">${body}</div>
    </div>
  </div>`;

  wireEvents();
  if (window.lucide) window.lucide.createIcons({ attrs:{ 'stroke-width':1.8 } });
  const cs = document.getElementById('chatScroll'); if (cs) cs.scrollTop = cs.scrollHeight;
}

function wireEvents(){
  document.querySelectorAll('[data-act]').forEach(el=>{
    const act = el.getAttribute('data-act'), val = el.getAttribute('data-val');
    switch(act){
      case 'tab': el.onclick=()=>{ state.tab=val; render(); }; break;
      case 'ch': el.onclick=()=>{ state.chFilter=val; render(); }; break;
      case 'budgetDir': el.onclick=()=>{ state.budgetDir = state.budgetDir==='desc'?'asc':'desc'; render(); }; break;
      case 'month': el.onchange=e=>{ state.monthIdx=Number(e.target.value); render(); }; break;
      case 'campPlat': el.onchange=e=>{ state.campPlat=e.target.value; render(); }; break;
      case 'campSort': el.onchange=e=>{ state.campSort=e.target.value; render(); }; break;
      case 'newComment': el.oninput=e=>{ state.newComment=e.target.value; }; break;
      case 'newCommentTag': el.onchange=e=>{ state.newCommentTag=e.target.value; }; break;
      case 'addComment': el.onclick=addComment; break;
      case 'rmComment': el.onclick=()=>removeComment(val); break;
      case 'chatInput': el.oninput=e=>{ state.chatInput=e.target.value; };
                        el.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendChat(); } }; break;
      case 'sendChat': el.onclick=sendChat; break;
    }
  });
}

function addComment(){
  const txt = (state.newComment||'').trim(); if(!txt) return;
  const d = new Date();
  const date = String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
  state.comments = [{ id:Date.now(), date, tag:state.newCommentTag, text:txt }, ...state.comments];
  state.newComment=''; saveComments(state.comments); render();
}
function removeComment(id){
  state.comments = state.comments.filter(c=>String(c.id)!==String(id));
  saveComments(state.comments); render();
}

async function sendChat(){
  const q = (state.chatInput||'').trim(); if(!q || state.chatLoading) return;
  state.chat = [...state.chat, { role:'user', text:q }];
  state.chatInput=''; state.chatLoading=true; render();
  try {
    let answer;
    if (CONFIG.CHAT_ENDPOINT){
      const messages = state.chat.map(m=>({ role:m.role==='assistant'?'assistant':'user', content:m.text }));
      const res = await fetch(CONFIG.CHAT_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ messages, system:'Você é um analista de inteligência de mercado para o setor farma/varejo brasileiro (drogarias, ex: Bom Preço). Responda em português, direto e prático, focado em marketing, mídia paga, concorrência e comportamento do consumidor. Máximo 100 palavras.', max_tokens:400 }) });
      const data = await res.json();
      answer = data.answer || data.text || data.content || 'Sem resposta do endpoint.';
    } else {
      answer = 'Assistente de IA não configurado nesta versão publicada. Para ativar, defina CONFIG.CHAT_ENDPOINT com o endpoint da sua API (ex.: função serverless que chama a API da Anthropic).';
    }
    state.chat = [...state.chat, { role:'assistant', text:answer }];
  } catch(e){
    state.chat = [...state.chat, { role:'assistant', text:'Assistente indisponível agora. Tente novamente em instantes.' }];
  }
  state.chatLoading=false; render();
}

// CSV esperado (formato longo): serie,jan,fev,mar,abr,mai,jun,jul

// Séries: loja.fat2025, loja.fat, loja.crescMes, loja.notas, loja.ticket,
//         site.fat, site.crescMes, site.notas, site.ticket, site.visitas, site.conversao,
//         callcenter.fat, callcenter.crescMes, callcenter.notas, callcenter.ticket,
//         ifood.fat, ifood.crescMes, ifood.notas, ifood.ticket
// Aceita número em pt-BR ("1.234,56") ou padrão ("1234.56"). Vazio => null.
function toNum(t){
  t = (t||'').trim();
  if (t==='') return null;
  if (t.includes(',')) t = t.replace(/\./g,'').replace(',','.');
  const n = Number(t);
  return isNaN(n) ? null : n;
}
function parseCSV(text){
  const rows = text.trim().split(/\r?\n/).map(r=>r.split(','));
  rows.shift(); // cabeçalho
  rows.forEach(cols=>{
    const serie = (cols[0]||'').trim();
    if(!serie) return;
    if(serie==='atualizacao'){ if(cols[1]) ATUALIZACAO=cols[1].trim(); return; }
    const parts = serie.split('.'); if(parts.length!==2) return;
    const [grp,met] = parts; if(!DATA[grp]) return;
    DATA[grp][met] = cols.slice(1,8).map(toNum);
  });
}
async function loadFromSheet(){
  if(!CONFIG.SHEET_CSV_URL) return false;
  try {
    const res = await fetch(CONFIG.SHEET_CSV_URL, { cache:'no-store' });
    const text = await res.text();
    parseCSV(text);
    return true;
  } catch(e){ console.warn('Falha ao ler a planilha, usando dados embutidos.', e); return false; }
}

async function boot(){
  await loadFromSheet();
  render();
  if (CONFIG.SHEET_CSV_URL && CONFIG.REFRESH_MS){
    setInterval(async ()=>{ const ok = await loadFromSheet(); if(ok) render(); }, CONFIG.REFRESH_MS);
  }
}
boot();
</script>
